[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pontoalerta"
version = "0.1.0"
description = "Identificação de ocorrências urbanas próximas por divisão e conquista."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.32,<2",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10"]

[project.scripts]
pontoalerta = "pontoalerta.cli:main"
pontoalerta-benchmark = "pontoalerta.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
